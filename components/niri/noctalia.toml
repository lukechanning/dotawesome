# Noctalia native v5; GUI overrides live in the isolated Niri state directory.
[theme]
mode = "dark"
shell_mode = "dark"
source = "custom"
custom_palette = "Graphite-Jade"

[theme.templates]
enable_builtin_templates = false
builtin_ids = []
enable_community_templates = false
community_ids = []

[storage]
key_source = "secret-service"

[shell]
corner_radius_scale = 0.45
font_family = "Noto Sans"
popup_shadows = true
setup_wizard_enabled = false
telemetry_enabled = false
external_ip_enabled = false
show_location = false
niri_overview_type_to_launch_enabled = false
polkit_agent = true
screen_time_enabled = false
clipboard_enabled = true
clipboard_history_max_entries = 100
clipboard_confirm_clear_history = true
clipboard_auto_paste = "off"
settings_window_translucent = false

[shell.animation]
enabled = true
speed = 1.5

[shell.launcher]
fetch_exchange_rates = false

[shell.shadow]
alpha = 0.25
direction = "down"

[shell.panel]
transparency_mode = "solid"
borders = true
shadow = true
control_center_placement = "floating"
control_center_position = "top_right"
floating_offset = 8

[shell.greeter_sync]
auto_sync = false

[bar.default]
position = "top"
thickness = 42
font_weight = 600
margin_ends = 10
margin_edge = 6
radius = 8
radius_top_left = 8
radius_top_right = 8
radius_bottom_left = 8
radius_bottom_right = 8
background_opacity = 0.0
compositor_blur = false
border = "#00000000"
border_width = 0.5
shadow = false
reserve_space = true
padding = 12
widget_spacing = 10
start = ["group:navigation"]
center = ["group:world-clocks"]
end = ["group:metrics", "group:status"]

[[bar.default.capsule_group]]
id = "navigation"
members = ["taskbar"]
fill = "surface"
opacity = 0.96
padding = 12.0
radius = 6.0

[[bar.default.capsule_group]]
id = "status"
fill = "surface"
opacity = 0.96
padding = 12.0
radius = 6.0
widget_spacing = 10
members = ["network", "bluetooth", "volume", "battery", "caffeine", "clipboard", "notifications", "tray"]

[[bar.default.capsule_group]]
id = "metrics"
members = ["cpu", "ram"]
fill = "surface"
opacity = 0.96
padding = 12.0
radius = 6.0
widget_spacing = 10

# Native clocks: Amsterdam normally, the other zones revealed on hover.
[[bar.default.capsule_group]]
id = "world-clocks"
members = ["clock", "clock-nyc", "clock-la", "clock-auckland"]
accordion = true
accordion_direction = "end"
fill = "surface"
opacity = 1.0
padding = 4.0
radius = 6.0
widget_spacing = 10

[widget.clock]
timezone = "Europe/Amsterdam"
format = "{:%H:%M}"
tooltip_format = "Amsterdam — {:%A %d %B, %H:%M %Z}"

[widget.clock.actions]
left = "panel-open control-center"

[widget.clock-nyc]
type = "clock"
timezone = "America/New_York"
format = "NYC {:%H:%M}"
tooltip_format = "New York — {:%a %d %b, %H:%M %Z}"

[widget.clock-la]
type = "clock"
timezone = "America/Los_Angeles"
format = "LA {:%H:%M}"
tooltip_format = "Los Angeles — {:%a %d %b, %H:%M %Z}"

[widget.clock-auckland]
type = "clock"
timezone = "Pacific/Auckland"
format = "NZ {:%H:%M}"
tooltip_format = "Auckland — {:%a %d %b, %H:%M %Z}"

[widget.network]
show_label = false

[widget.network.actions]
left = "panel-open control-center network"

[widget.bluetooth.actions]
left = "panel-open control-center bluetooth"

[widget.battery.actions]
middle = "caffeine-toggle"

# Native coffee glyph provides persistent inhibitor-state feedback.
[widget.caffeine]
type = "caffeine"

[widget.clipboard.actions]
left = "panel-toggle clipboard"

[widget.notifications]
hide_when_no_unread = true

[widget.notifications.actions]
left = "panel-open control-center notifications"

[widget.taskbar]
type = "taskbar"
group_by_workspace = true
show_workspace_label = true
workspace_label_placement = "inside"
workspace_group_capsule = true
workspace_group_content = "icons"
group_single_icon_per_app = true
hide_empty_workspaces = true
only_active_workspace = false
show_all_outputs = false
icon_scale = 0.85
show_active_indicator = true
active_indicator_color = "primary"
capsule_radius = 4.0
focused_color = "primary"
occupied_color = "surface_variant"
empty_color = "surface_variant"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
show_glyph = false
custom_label = "CPU"
show_value = true

[widget.ram]
type = "sysmon"
stat = "ram_pct"
visualization = "none"
show_glyph = false
custom_label = "RAM"
show_value = true

[widget.volume.actions]
left = "panel-open control-center audio"

[widget.media]
hide_album_art = true
hide_artist = true
max_length = 160
min_length = 40
hide_when_no_media = true

# Sample only the requested CPU/RAM numbers, at a restrained cadence.
[system.monitor]
enabled = true
cpu_poll_seconds = 3.0
memory_poll_seconds = 5.0
gpu_poll_seconds = 0.0
network_poll_seconds = 0.0
disk_poll_seconds = 0.0

[control_center]
sidebar = "compact"
hidden_tabs = ["weather", "screen-time"]

[notification]
enable_daemon = true
background_opacity = 0.9

[lockscreen]
enabled = true
lock_before_suspend = true
transition = []

[idle]
behavior_order = ["lock", "screen-off"]
pre_action_fade_seconds = 0.0

[idle.behavior.lock]
enabled = true
action = "lock"
timeout = 600

[idle.behavior.screen-off]
enabled = true
action = "screen_off"
timeout = 900

[dock]
enabled = false

[desktop_widgets]
enabled = false

[weather]
enabled = false

[location]
auto_locate = false
address = ""

[calendar]
enabled = true

[wallpaper]
transition = []
enabled = true
fill_color = "#161821"

[wallpaper.automation]
enabled = false

[backdrop]
enabled = false

[plugins]
enabled = []
auto_update = "none"
