name = "desktop"
terminal = ["alacritty"]
# Reuse KDE's encrypted wallet across the KDE and Niri sessions, as on the G14.
secret_portal = "kwallet"
vivaldi_password_store = "kwallet6"
signal_password_store = "kwallet6"
# GPU and output modes use automatic selection.
# Shared keyboard remap and monitor shortcuts come from base.kdl.

# Use the same local wallpaper as the G14; image data stays outside the repo.
[wallpaper]
default = "~/Pictures/Path.jpg"
favorites = ["~/Pictures/Path.jpg", "~/Pictures/OneStandsOut.jpg"]

[[apps]]
name = "Vivaldi"
jump_key = "b"
command = ["vivaldi-stable", "--ozone-platform=wayland"]
app_ids = ["vivaldi-stable", "vivaldi"]
workspace = "1"
width = "100%"

[[apps]]
name = "Alacritty"
jump_key = "t"
command = ["alacritty"]
app_ids = ["Alacritty", "alacritty"]
workspace = "1"
width = "100%"
