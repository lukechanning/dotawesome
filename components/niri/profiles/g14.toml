name = "g14"
terminal = ["alacritty"]
preferred_output = "PNP(AOC) 27B36X XI7S4HA042988"
# AMD integrated GPU for Niri desktop rendering; NVIDIA remains available.
render_device = "/dev/dri/by-path/pci-0000:65:00.0-render"
# Reuse KDE's encrypted wallet through the desktop Secret portal.
secret_portal = "kwallet"
# Pin the same encrypted browser store across KDE and Niri, for every launcher.
vivaldi_password_store = "kwallet6"
# Signal's existing database key is protected by this same backend.
signal_password_store = "kwallet6"

# Reuse existing KDE image files; keep image data and GUI overrides local.
[wallpaper]
default = "~/Pictures/Path.jpg"
favorites = ["~/Pictures/Path.jpg", "~/Pictures/OneStandsOut.jpg"]

[laptop]
identity = "eDP-2"
mode = "2880x1800@60.001"
scale = 1.6

# Shared AOC scale is in base.kdl; mode and placement remain automatic.
# See docs/niri.md before opting into a pinned external mode/workspace layout.

[[apps]]
name = "Vivaldi"
jump_key = "b"
command = ["vivaldi-stable", "--ozone-platform=wayland"]
app_ids = ["vivaldi-stable", "vivaldi"]
workspace = "One"
width = "100%"

[[apps]]
name = "Alacritty"
jump_key = "t"
command = ["alacritty"]
app_ids = ["Alacritty", "alacritty"]
workspace = "One"
width = "100%"
